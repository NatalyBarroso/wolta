name: Release on merge

# Tags and releases a merged PR, but only when it carries the `release` label.
# The version comes from pyproject.toml, so bump it in the PR before merging.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version found in pyproject.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse an existing tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version in pyproject.toml."
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Merged in #$PR_NUMBER: $PR_TITLE" > release-notes.md
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
